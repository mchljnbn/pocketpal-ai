name: Build APK

on:
  push:
    branches: [ui-refresh-android]
  workflow_dispatch:

permissions:
  contents: write # lets the job attach the APK to a GitHub Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Must run before setup-node / setup-java (they install into hostedtoolcache)
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: 'yarn'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Derive the rnllama variant allowlist
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Cache llama.rn native build tree
        uses: actions/cache@v4
        with:
          path: node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('yarn.lock', 'scripts/android-payload-manifest.json') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-for-ci",
              "storage_bucket": "dummy-project-for-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.pocketpalai"
                }
              },
              "api_key": [{
                "current_key": "dummy-api-key-for-ci-builds"
              }]
            }]
          }
          EOL

      - name: Create dummy .env file
        run: |
          cat > .env << 'EOL'
          FIREBASE_FUNCTIONS_URL=https://dummy-firebase-url.com
          SUPABASE_URL=https://dummy-supabase-url.supabase.co
          SUPABASE_ANON_KEY=dummy-anon-key-for-ci-builds
          PALSHUB_API_BASE_URL=https://dummy-palshub-api.com
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          GOOGLE_IOS_CLIENT_ID=dummy-ios-client-id.apps.googleusercontent.com
          GOOGLE_WEB_CLIENT_ID=dummy-web-client-id.apps.googleusercontent.com
          EOL

      # No dummy keystore and no APP_RELEASE_* variables on purpose:
      # build.gradle then signs with the committed android/app/debug.keystore,
      # so every build carries the same signature.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleProdRelease

      - name: Show signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/prod/release/app-prod-release.apk || true

      - name: Prepare release output
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/prod/release/app-prod-release.apk "out/PocketPal-${{ github.run_number }}.apk"
          sha256sum "out/PocketPal-${{ github.run_number }}.apk" > "out/PocketPal-${{ github.run_number }}.apk.sha256"

      # Keep this only as a debug artifact; do not rely on it for final delivery.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-apk
          path: out/*.apk
          if-no-files-found: error

      # Best option: publish the raw APK directly to the GitHub Release.
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build #${{ github.run_number }}
          prerelease: true
          files: |
            out/*.apk
            out/*.sha256
